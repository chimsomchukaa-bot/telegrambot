services:
  - type: worker
    name: celebrity-management-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/celebrity_management.db
      - key: CUSTOMER_SUPPORT_EMAIL
        value: christianclement463@gmail.com
      - key: TIMEZONE
        value: America/New_York
